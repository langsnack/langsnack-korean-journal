<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Saved explanations | Langsnack Notebook</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="shared.css?v=final-working-1"></head><body><main class="nb-shell"><header class="nb-header"><a class="nb-brand" href="/" style="text-decoration:none;color:inherit"><span class="nb-logo">ㄱ</span><span><strong>Langsnack Notebook</strong><span>Your Korean learning space</span></span></a><nav class="nb-nav"><a href="/" data-nav="home">Write</a><a href="history.html" data-nav="work">My work</a><a href="saved.html" data-nav="saved">Saved</a></nav><div class="nb-actions"><select id="languageSelect" aria-label="Language"><option value="en">EN</option><option value="ko">한국어</option></select><label class="header-timezone"><select id="timezoneSelect" aria-label="Time zone"></select></label></div></header><section class="nb-main saved-page">
  <div class="saved-hero">
    <div>
      <span class="nb-kicker">Personal knowledge base</span>
      <h1>Saved explanations</h1>
      <p>Keep useful feedback from Nicole and find it again whenever you need it.</p>
    </div>
    <div class="saved-summary">
      <strong id="savedCount">0</strong>
      <span>saved notes</span>
    </div>
  </div>

  <div class="saved-toolbar">
    <label class="saved-search">
      <span aria-hidden="true">⌕</span>
      <input id="searchInput" placeholder="Search saved explanations">
    </label>
  </div>

  <div class="nb-saved-grid" id="savedGrid"></div>
</section></main><script src="shared.js?v=null-state-fix-1"></script><script src="timezone-picker.js?v=final-working-1"></script><script>
const LANG_TEXT_SAVED = {
  en: {
    pageTitle: "Saved explanations",
    intro: "Keep useful feedback from Nicole and find it again whenever you need it.",
    count: "saved notes",
    search: "Search saved explanations",
    savedFrom: "Saved from feedback",
    saved: "Saved",
    open: "Open writing",
    emptyTitle: "Nothing saved yet",
    emptyText: "Open a returned writing and bookmark a useful explanation from Nicole.",
    goToWork: "Go to My Work",
    noMatch: "No matching explanations",
    tryAnother: "Try another keyword."
  },
  ko: {
    pageTitle: "저장한 설명",
    intro: "니콜쌤의 피드백 중 도움이 되는 설명을 저장해 두고 필요할 때 다시 확인할 수 있어요.",
    count: "저장한 설명",
    search: "저장한 설명 검색",
    savedFrom: "피드백에서 저장",
    saved: "저장일",
    open: "글 확인하기",
    emptyTitle: "아직 저장한 설명이 없어요",
    emptyText: "첨삭이 완료된 글에서 도움이 되는 설명을 저장해 보세요.",
    goToWork: "내 글로 가기",
    noMatch: "검색 결과가 없어요",
    tryAnother: "다른 검색어를 입력해 보세요."
  }
};

function applySavedLanguage(){
  const t=LANG_TEXT_SAVED[savedState.language]||LANG_TEXT_SAVED.en;
  const title=document.querySelector(".saved-hero h1");
  const intro=document.querySelector(".saved-hero p");
  const countLabel=document.querySelector(".saved-summary span");
  if(title)title.textContent=t.pageTitle;
  if(intro)intro.textContent=t.intro;
  if(countLabel)countLabel.textContent=t.count;
  if(window.searchInput)searchInput.placeholder=t.search;
}


exposeNotebookElements();
/* Explicit element bindings for Wix iframe compatibility */
var languageSelect = document.getElementById("languageSelect");
var savedCount = document.getElementById("savedCount");
var searchInput = document.getElementById("searchInput");
var savedGrid = document.getElementById("savedGrid");

const savedState = getState();

function savedTitle(item){
  return item.title && item.title !== "Teacher explanation"
    ? item.title
    : (savedState.language === "ko" ? "니콜쌤의 설명" : "Nicole’s explanation");
}

function draw(){
  const query = searchInput.value.toLowerCase().trim();
  const allItems = getBookmarks();
  const items = allItems.filter(item =>
    `${item.title || ""} ${item.text || ""}`.toLowerCase().includes(query)
  );

  savedCount.textContent = allItems.length;
  savedGrid.innerHTML = "";

  if(!items.length){
    savedGrid.innerHTML = `
      <section class="saved-empty">
        <span class="saved-empty-icon">☆</span>
        <h2>${query ? "No matching explanations" : "Nothing saved yet"}</h2>
        <p>${query
          ? "Try another keyword."
          : "Open a returned writing and bookmark a useful explanation from Nicole."}</p>
        ${query ? "" : `<a class="button button-primary" href="history.html">Go to My Work</a>`}
      </section>`;
    return;
  }

  items.forEach(item => {
    const card = document.createElement("article");
    card.className = "saved-note-card";
    card.innerHTML = `
      <div class="saved-note-top">
        <span class="saved-note-source">
          <i>✓</i>
          Saved from feedback
        </span>
        <button class="saved-remove" type="button" aria-label="Remove saved explanation" title="Remove from saved">
          <span aria-hidden="true">★</span>
        </button>
      </div>

      <div class="saved-note-body">
        <h2>${escapeHTML(savedTitle(item))}</h2>
        <blockquote>${escapeHTML(item.text || "")}</blockquote>
      </div>

      <div class="saved-note-footer">
        <div>
          <span>Saved</span>
          <strong>${relativeDate(item.savedAt)}</strong>
        </div>
        <a class="saved-open-link" href="submission.html?id=${encodeURIComponent(item.submissionId)}">
          Open writing <span aria-hidden="true">→</span>
        </a>
      </div>`;

    card.querySelector(".saved-remove").onclick = () => {
      toggleBookmark(item);
      draw();
    };

    savedGrid.appendChild(card);
  });
}

searchInput.oninput = draw;
document.querySelector('[data-nav="saved"]').classList.add('active');
languageSelect.value = savedState.language;
draw();

applySavedLanguage();
</script></body></html>
