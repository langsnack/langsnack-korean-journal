<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Journal | Langsnack</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="shared.css"></head>
<body><main class="shell"><header class="topbar"><div class="brand"><h1>Langsnack Korean Journal</h1><p id="tagline">A quiet place to write in Korean.</p></div><div class="header-actions">
  <div class="control">
    <label for="language">Language</label>
    <select id="language" aria-label="Language">
      <option value="en">EN</option>
      <option value="ko">한국어</option>
    </select>
  </div>
  <div class="control">
    <label for="timezoneSelect">Time zone</label>
    <select id="timezoneSelect" aria-label="Time zone"></select>
  </div>
</div></header>
<nav class="page-nav"><a class="nav-link active" href="index.html" id="navJournal">Journal</a><a class="nav-link" href="history.html" id="navHistory">Submission history</a></nav>
<section class="card page-card"><p class="eyebrow" id="eye">Today's writing</p><h2 class="page-title" id="title">Write freely in Korean</h2><p class="intro" id="intro">Draft here, then continue to the formatted submission page.</p><div id="journalMount"></div><div class="actions" style="justify-content:flex-end;margin-top:18px"><button class="button button-secondary" id="save">Save draft</button><button class="button button-primary" id="continue">Continue to submit</button></div></section></main><div class="toast" id="toast"></div>
<script src="shared.js"></script>
<script src="timezone-picker.js"></script>
<script>
const state=getState();const T={en:{tag:"A quiet place to write in Korean.",journal:"Journal",history:"Submission history",eye:"Today's writing",title:"Write freely in Korean",intro:"Draft here, then continue to the formatted submission page.",save:"Save draft",go:"Continue to submit",saved:"Draft saved."},ko:{tag:"한국어로 조용히 글을 써보는 공간이에요.",journal:"일기장",history:"제출 내역",eye:"오늘의 글쓰기",title:"한국어로 자유롭게 써 보세요",intro:"이곳에서 초안을 작성한 뒤 제출 페이지에서 형식을 정리할 수 있어요.",save:"임시 저장",go:"제출하러 가기",saved:"임시 저장했어요."}};
journalMount.innerHTML=richEditorHTML("journalEditor",state.language==="ko"?"한국어로 자유롭게 써 보세요...":"Write your Korean journal here...");const ed=initRichEditor(journalMount);ed.innerHTML=state.journal||"";
function apply(){const t=T[state.language];tagline.textContent=t.tag;navJournal.textContent=t.journal;navHistory.textContent=t.history;eye.textContent=t.eye;title.textContent=t.title;intro.textContent=t.intro;save.textContent=t.save;continue.textContent=t.go;language.value=state.language}
language.onchange=()=>{state.language=language.value;saveState(state);apply()};

window.addEventListener("langsnack:timezone-change", (event) => {
  state.timeZone = event.detail.timeZone;
  saveState(state);
});save.onclick=()=>{state.journal=ed.innerHTML;saveState(state);toast(T[state.language].saved)};continue.onclick=()=>{state.journal=ed.innerHTML;saveState(state);sessionStorage.setItem(LS.draft,JSON.stringify({html:ed.innerHTML,plain:stripHTML(ed.innerHTML)}));location.href="submit.html"};apply();
</script></body></html>
