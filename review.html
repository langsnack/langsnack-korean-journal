<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Review | Langsnack</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css"></head><body><main class="shell">
<header class="topbar"><div class="brand"><h1>Langsnack Korean Journal</h1><p id="tagline">Writing feedback</p></div><div class="topbar-actions"><label class="header-control"><span>Language</span><select id="languageSelect"><option value="en">EN</option><option value="ko">한국어</option></select></label></div><div class="member-area"><div class="member-copy"><strong id="statusTop">Review</strong><span id="statusSub">Open your submission and feedback.</span></div></div></header>
<nav class="page-nav"><a class="nav-link" href="index.html" id="navJournal">Journal</a><a class="nav-link" href="history.html" id="navHistory">Submission history</a></nav>
<section class="page-card" id="reviewCard"></section></main><script src="shared.js"></script><script>
const state=getJournalState();const id=new URLSearchParams(location.search).get("id"),item=getSubmissions().find(x=>x.id===id);
if(!item){location.href="history.html"}
const tx={en:{tagline:"Writing feedback",review:"Review",sub:"Open your submission and feedback.",journal:"Journal",history:"Submission history",original:"Original",question:"Your question",corrected:"Corrected version",notes:"Teacher notes",waiting:"Your journal is still waiting for review."},ko:{tagline:"글쓰기 첨삭",review:"첨삭",sub:"제출한 글과 첨삭을 확인해요.",journal:"일기장",history:"제출 내역",original:"원문",question:"내 질문",corrected:"첨삭본",notes:"선생님 코멘트",waiting:"아직 첨삭 대기 중이에요."}};
function render(){const t=tx[state.language];document.documentElement.lang=state.language;tagline.textContent=t.tagline;statusTop.textContent=t.review;statusSub.textContent=t.sub;navJournal.textContent=t.journal;navHistory.textContent=t.history;languageSelect.value=state.language;
reviewCard.innerHTML=`<div class="submission-head"><div><p class="eyebrow">${formatDate(item.submittedAt,state.language)}</p><h2 class="page-title">${escapeHTML(item.level)}</h2></div><span class="${statusClass(item.status)}">${statusText(item.status,state.language)}</span></div>
<div class="field"><label>${t.original}</label><div class="text-panel">${escapeHTML(item.originalText)}</div></div>
<div class="field"><label>${t.question}</label><div class="text-panel">${escapeHTML(item.studentQuestion||"—")}</div></div>
${item.status==="completed"?`<div class="field"><label>${t.corrected}</label><div class="text-panel">${escapeHTML(item.correctedText||"")}</div></div><div class="field"><label>${t.notes}</label><div class="text-panel">${escapeHTML(item.teacherComment||"")}</div></div>`:`<p class="intro" style="margin-top:20px">${t.waiting}</p>`}`;}
languageSelect.onchange=()=>{state.language=languageSelect.value;saveJournalState(state);render()};render();
</script></body></html>
