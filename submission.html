<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Review | Langsnack Notebook</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="shared.css"></head><body><main class="nb-shell"><header class="nb-header"><a class="nb-brand" href="index.html" style="text-decoration:none;color:inherit"><span class="nb-logo">ㄱ</span><span><strong>Langsnack Notebook</strong><span>Your Korean learning space</span></span></a><nav class="nb-nav"><a href="index.html" data-nav="home">Write</a><a href="history.html" data-nav="work">My work</a><a href="saved.html" data-nav="saved">Saved</a></nav><div class="nb-actions"><select id="languageSelect" aria-label="Language"><option value="en">EN</option><option value="ko">한국어</option></select><label class="header-timezone"><select id="timezoneSelect" aria-label="Time zone"></select></label></div></header><section class="nb-main" id="content"></section></main><div class="toast" id="toast"></div><script src="shared.js"></script><script src="timezone-picker.js"></script><script>
const state=getState(),id=new URLSearchParams(location.search).get('id');let item=getSubmissions().find(x=>(x.id||x._id)===id);function attachments(){if(!item.attachments?.length)return '';return `<div class="nb-card nb-card-pad" style="margin-top:16px"><span class="nb-kicker">Attachments</span><div class="nb-file-list">${item.attachments.map(a=>`<div class="nb-file"><span>📎 <strong>${escapeHTML(a.name)}</strong></span><small class="muted">Preview available after Wix Media connection</small></div>`).join('')}</div></div>`}function drawThread(){const thread=threadFor(id);threadList.innerHTML=thread.length?'':'<p class="muted">No questions yet. Ask about anything in this correction.</p>';thread.forEach(m=>{const el=document.createElement('div');el.className='nb-message '+(m.author==='student'?'student':'');el.innerHTML=`<span class="nb-avatar">${escapeHTML((m.name||m.author).charAt(0).toUpperCase())}</span><div class="nb-bubble"><strong>${escapeHTML(m.name||m.author)}</strong><div>${escapeHTML(m.text)}</div><small>${relativeDate(m.createdAt)}</small></div>`;threadList.appendChild(el)})}function render(){if(!item){content.innerHTML='<div class="nb-empty"><h1>Submission not found</h1><a href="history.html">Back to My work</a></div>';return}const teacher=item.teacherHtml||item.studentHtml||'',bookmarkKey=`${id}:teacher-note`;content.innerHTML=`<div class="nb-page-head"><div><span class="nb-kicker">${escapeHTML(item.category||'Submission')}</span><h1>${escapeHTML(item.title||'Your writing')}</h1><p>${formatDate(item.submittedAt,state.language)} · <span class="${statusClass(item.status)}">${statusText(item.status,state.language)}</span></p></div><a class="button button-secondary" href="history.html">Back to My work</a></div><section class="nb-card nb-card-pad"><span class="nb-kicker">Progress</span><div class="nb-timeline"><span class="nb-step done">Draft</span><span class="nb-step done">Submitted</span><span class="nb-step ${item.status!=='pending'?'done':''}">Review started</span><span class="nb-step ${item.status==='completed'?'done':''}">Returned</span><span class="nb-step">Student revision</span></div></section><div class="nb-compare" style="margin-top:16px"><article class="nb-card nb-pane"><div class="nb-pane-head"><div><span class="nb-kicker">Original</span><h2>Your version</h2></div><span class="muted">${(item.studentPlain||'').split(/\s+/).filter(Boolean).length} words</span></div><div class="nb-writing">${item.studentHtml||escapeHTML(item.studentPlain||'No written text.')}</div></article><article class="nb-card nb-pane nb-correction"><div class="nb-pane-head"><div><span class="nb-kicker">Teacher review</span><h2>Nicole's correction</h2></div><button class="nb-bookmark ${isBookmarked(bookmarkKey)?'saved':''}" id="bookmarkButton">⭐ ${isBookmarked(bookmarkKey)?'Saved':'Save explanation'}</button></div><div class="nb-writing">${item.status==='completed'?teacher:'Your correction will appear here after Nicole returns it.'}</div>${item.teacherNote?`<div class="notice" style="margin-top:18px"><strong>Nicole's note</strong><p>${escapeHTML(item.teacherNote)}</p></div>`:''}</article></div>${attachments()}<section class="nb-card nb-card-pad" style="margin-top:16px"><div style="display:flex;justify-content:space-between;gap:15px"><div><span class="nb-kicker">Conversation</span><h2 style="margin-top:5px">Questions about this work</h2></div></div><div class="nb-thread" id="threadList"></div><div class="nb-thread-compose"><textarea class="nb-textarea" id="messageInput" placeholder="Ask Nicole a question..."></textarea><button class="button button-primary" id="sendMessage">Send</button></div></section>`;bookmarkButton.onclick=()=>{const saved=toggleBookmark({key:bookmarkKey,submissionId:id,title:item.title||'Teacher explanation',text:item.teacherNote||stripHTML(teacher),sourceDate:item.completedAt||item.submittedAt});bookmarkButton.classList.toggle('saved',saved);bookmarkButton.textContent=saved?'⭐ Saved':'⭐ Save explanation';toast(saved?'Explanation saved.':'Removed from saved.')};sendMessage.onclick=()=>{const text=messageInput.value.trim();if(!text)return;addThreadMessage(id,{author:'student',name:state.profile.name||'Student',text});messageInput.value='';drawThread()};drawThread()}document.querySelector('[data-nav="work"]').classList.add('active');languageSelect.value=state.language;render();
</script></body></html>
