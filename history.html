<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My work | Langsnack Notebook</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="shared.css"></head><body><main class="nb-shell"><header class="nb-header"><a class="nb-brand" href="index.html" style="text-decoration:none;color:inherit"><span class="nb-logo">ㄱ</span><span><strong>Langsnack Notebook</strong><span>Your Korean learning space</span></span></a><nav class="nb-nav"><a href="index.html" data-nav="home">Write</a><a href="history.html" data-nav="work">My work</a><a href="saved.html" data-nav="saved">Saved</a></nav><div class="nb-actions"><select id="languageSelect" aria-label="Language"><option value="en">EN</option><option value="ko">한국어</option></select><label class="header-timezone"><select id="timezoneSelect" aria-label="Time zone"></select></label></div></header><section class="nb-main"><div class="nb-page-head"><div><span class="nb-kicker">Your learning history</span><h1>My work</h1><p>Open any submission to see feedback, questions and its version history.</p></div><div class="nb-filter"><input id="searchInput" placeholder="Search your work"><select id="statusInput"><option value="all">All statuses</option><option value="pending">Waiting</option><option value="reviewing">Reviewing</option><option value="completed">Returned</option></select><a class="button button-primary" href="index.html#writing">New writing</a></div></div><section class="nb-card nb-card-pad"><div class="nb-work-list" id="workList"></div></section></section></main><script src="shared.js"></script><script src="timezone-picker.js"></script><script>
const state=getState();function draw(){const q=searchInput.value.toLowerCase(),s=statusInput.value;const all=getSubmissions().filter(x=>(s==='all'||x.status===s)&&`${x.title||''} ${x.studentPlain||''} ${x.category||''}`.toLowerCase().includes(q));workList.innerHTML=all.length?'':'<div class="nb-empty"><h2>No work here yet</h2><p>Start a new writing from your notebook.</p></div>';all.forEach(x=>{const a=document.createElement('a');a.className='nb-work-card';a.href=`submission.html?id=${encodeURIComponent(x.id||x._id)}`;a.innerHTML=`<span class="nb-work-icon">${x.category==='Speaking'?'🎤':x.category==='TOPIK writing'?'📄':'📝'}</span><span><strong>${escapeHTML(x.title||x.category||'Untitled')}</strong><p>${escapeHTML((x.studentPlain||x.attachments?.map(a=>a.name).join(', ')||'Attachment submission').slice(0,90))}</p></span><span style="text-align:right"><span class="${statusClass(x.status)}">${statusText(x.status,state.language)}</span><time style="display:block;margin-top:8px">${relativeDate(x.submittedAt)}</time></span>`;workList.appendChild(a)})}searchInput.oninput=draw;statusInput.onchange=draw;document.querySelector('[data-nav="work"]').classList.add('active');languageSelect.value=state.language;draw();
</script></body></html>
